<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Cuadra compara dos exportaciones de inventario sin adivinar equivalencias."
    />
    <title>Cuadra</title>
    <script>
      try {
        var preferencia = localStorage.getItem("cuadra-tema") || "sistema"
        if (preferencia !== "claro" && preferencia !== "oscuro") preferencia = "sistema"
        var oscuro =
          preferencia === "oscuro" ||
          (preferencia === "sistema" && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.dataset.tema = oscuro ? "oscuro" : "claro"
        document.documentElement.dataset.preferencia = preferencia
        document.documentElement.classList.toggle("dark", oscuro)
      } catch (error) {
        document.documentElement.dataset.tema = "claro"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
